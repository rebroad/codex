# Builds, uploads, and publishes the fork-owned npm artifacts.
name: custom-codex-release

on:
  push:
    tags:
      - "codex-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "codex-v* tag to build"
        required: true
        type: string
      reuse_artifacts_run_id:
        description: "Completed run ID whose npm-source artifacts should be reused"
        required: false
        default: ""
        type: string
      publish_npm:
        description: "Publish the assembled packages to npm"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: custom-codex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    outputs:
      package_version: ${{ steps.candidate.outputs.version }}
      build_timestamp: ${{ steps.candidate.outputs.build_timestamp }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      source_tag: ${{ steps.candidate.outputs.source_tag }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "${tag}" == codex-v* ]] || { echo "Invalid release tag: ${tag}" >&2; exit 1; }
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Determine candidate package version
        id: candidate
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/Cargo.toml | head -n 1)"
          tag="${{ steps.release.outputs.tag }}"
          package_version="${tag#codex-v}"
          [[ "${package_version}" == "${base_version}."* ]] || {
            echo "Release tag does not contain the workspace version: ${tag}" >&2
            exit 1
          }
          candidate_suffix="${package_version#${base_version}.}"
          [[ "${candidate_suffix}" =~ ^[0-9a-f]{10}\.[0-9]{12}$ ]] || {
            echo "Release tag does not contain a valid candidate suffix: ${tag}" >&2
            exit 1
          }
          commit="$(git rev-parse --short=10 HEAD)"
          [[ "${candidate_suffix%%.*}" == "${commit}" ]] || {
            echo "Release tag commit does not match checked-out commit: ${tag}" >&2
            exit 1
          }
          build_timestamp="${candidate_suffix/./-}"
          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "build_timestamp=${build_timestamp}" >> "${GITHUB_OUTPUT}"
          echo "source_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=codex-npm-v${package_version}" >> "${GITHUB_OUTPUT}"


  build-source-target:
    name: Build npm source target - ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
          - platform: win32-arm64
            target: aarch64-pc-windows-msvc
            # Rusty V8's GN bootstrap has no Windows ARM64 host package. Use
            # the upstream cross-compile arrangement: x64 host, ARM64 target.
            runner: windows-2022
          - platform: linux-armv7
            target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04
          - platform: android-arm64
            target: aarch64-linux-android
            runner: ubuntu-24.04
    env:
      CARGO_NET_OFFLINE: "false"
      RUST_BACKTRACE: "1"
      RUST_TOOLCHAIN: "1.95.0"
      ANDROID_NDK_VERSION: "28.2.13676358"
      CODEX_BUILD_TIMESTAMP: ${{ needs.prepare-release.outputs.build_timestamp }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: inputs.reuse_artifacts_run_id == ''
        with:
          ref: ${{ needs.prepare-release.outputs.source_tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: inputs.reuse_artifacts_run_id == ''
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && matrix.target == 'armv7-unknown-linux-gnueabihf' && inputs.reuse_artifacts_run_id == ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf

      - name: Configure musl build tools
        if: contains(matrix.target, 'unknown-linux-musl') && inputs.reuse_artifacts_run_id == ''
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: contains(matrix.target, 'unknown-linux-musl') && inputs.reuse_artifacts_run_id == ''
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/install-musl-build-tools.sh

      - name: Disable aws-lc jitter entropy (musl)
        if: contains(matrix.target, 'unknown-linux-musl') && inputs.reuse_artifacts_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "${GITHUB_ENV}"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "${GITHUB_ENV}"

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android' && inputs.reuse_artifacts_run_id == ''
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set on the GitHub runner}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Configure Windows linker
        if: runner.os == 'Windows' && inputs.reuse_artifacts_run_id == ''
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Configure Rusty V8 artifacts
        if: inputs.reuse_artifacts_run_id == ''
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Configure Android linker
        if: matrix.target == 'aarch64-linux-android' && inputs.reuse_artifacts_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          llvm="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "${llvm}/bin/aarch64-linux-android29-clang++"
          builtins="$(find "${llvm}" -name libclang_rt.builtins-aarch64-android.a -print -quit)"
          [[ -n "${builtins}" ]] || { echo "Android compiler builtins archive not found" >&2; exit 1; }
          echo "CC_aarch64_linux_android=${llvm}/bin/aarch64-linux-android29-clang" >> "${GITHUB_ENV}"
          echo "CXX_aarch64_linux_android=${llvm}/bin/aarch64-linux-android29-clang++" >> "${GITHUB_ENV}"
          echo "AR_aarch64_linux_android=${llvm}/bin/llvm-ar" >> "${GITHUB_ENV}"
          echo "RANLIB_aarch64_linux_android=${llvm}/bin/llvm-ranlib" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${llvm}/bin/aarch64-linux-android29-clang++" >> "${GITHUB_ENV}"
          echo 'CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-Clink-arg=-lc++_shared -Clink-arg=-Wl,-rpath,$ORIGIN'" -Clink-arg=${builtins}" >> "${GITHUB_ENV}"

      - name: Apply ARMv7 Cargo patches
        if: matrix.target == 'armv7-unknown-linux-gnueabihf' && inputs.reuse_artifacts_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apply_target_cargo_patches.sh \
            codex-rs/Cargo.toml "${{ matrix.target }}"
          cd codex-rs
          cargo update -p pagable

      - name: Build and package source target
        if: inputs.reuse_artifacts_run_id == ''
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare-release.outputs.package_version }}
          OUTPUT_DIR: ${{ github.workspace }}.build/npm-source-artifact
          CARGO_TARGET_DIR: ${{ github.workspace }}.build/cargo-target
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/codex-rs"
          build_args=(
            cargo
          )
          [[ -n "${CODEX_V8_CARGO_CONFIG:-}" ]] && build_args+=(--config "${CODEX_V8_CARGO_CONFIG}")
          build_args+=(
            build --target "${TARGET}" --release --timings
            --bin codex
          )
          [[ "${TARGET}" != armv7-unknown-linux-gnueabihf ]] \
            && build_args+=(--bin codex-code-mode-host)
          case "${TARGET}" in
            *-unknown-linux-musl) build_args+=(--bin bwrap) ;;
            x86_64-pc-windows-msvc) export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC ;;
          esac
          "${build_args[@]}"

          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          vendor_dir="${RUNNER_TEMP}/codex-npm-vendor-${TARGET}"
          rm -rf "${vendor_dir}"
          mkdir -p "${vendor_dir}/${TARGET}/bin"
          binary_suffix=""
          [[ "${TARGET}" == *-pc-windows-msvc ]] && binary_suffix=.exe
          cp "${release_dir}/codex${binary_suffix}" \
            "${vendor_dir}/${TARGET}/bin/codex${binary_suffix}"
          if [[ "${TARGET}" != armv7-unknown-linux-gnueabihf ]]; then
            cp "${release_dir}/codex-code-mode-host${binary_suffix}" \
              "${vendor_dir}/${TARGET}/bin/codex-code-mode-host${binary_suffix}"
          fi
          if [[ "${TARGET}" == *-unknown-linux-musl ]]; then
            mkdir -p "${vendor_dir}/${TARGET}/codex-resources"
            cp "${release_dir}/bwrap" "${vendor_dir}/${TARGET}/codex-resources/bwrap"
          fi
          if [[ "${TARGET}" == aarch64-linux-android ]]; then
            cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
              "${vendor_dir}/${TARGET}/bin/libc++_shared.so"
          fi

          mkdir -p "${OUTPUT_DIR}"
          python3 "${GITHUB_WORKSPACE}/codex-cli/scripts/build_npm_package.py" \
            --release-version "${VERSION}" \
            --package "codex-${{ matrix.platform }}" \
            --vendor-src "${vendor_dir}" \
            --pack-output "${OUTPUT_DIR}/codex-npm-${{ matrix.platform }}-${VERSION}.tgz"

      - name: Reuse npm source artifact from completed run
        if: inputs.reuse_artifacts_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-source-${{ matrix.platform }}
          run-id: ${{ inputs.reuse_artifacts_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ github.workspace }}.build/npm-source-artifact

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-source-${{ matrix.platform }}
          path: ${{ github.workspace }}.build/npm-source-artifact/*.tgz
          if-no-files-found: error

  assemble-and-release:
    needs:
      - prepare-release
      - build-source-target
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ needs.prepare-release.outputs.package_version }}
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare-release.outputs.source_tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-source-*
          merge-multiple: true
          path: dist/npm-source

      - name: Assemble and audit source-built packages
        env:
          VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: |
          set -euo pipefail
          python3 scripts/assemble_npm_packages.py \
            --release-version "${VERSION}" \
            --no-upstream \
            --fork-artifact-dir dist/npm-source \
            --output-dir dist/npm-complete
          for archive in dist/npm-complete/codex-npm-*.tgz; do
            sha256sum "${archive}" >"${archive}.sha256"
          done
          python3 scripts/audit_npm_packages.py \
            --artifact-dir dist/npm-complete \
            --expected-version "${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "codex-npm-v${VERSION}" \
            --title "Codex ${VERSION}" \
            --generate-notes \
            dist/npm-complete/codex-npm-*.tgz \
            dist/npm-complete/codex-npm-*.tgz.sha256 \
            dist/npm-complete/npm-artifact-sources.json

  publish-npm:
    name: publish-npm
    if: >-
      ${{
        ((
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/codex-v')
        ) || (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_npm == true
        )) &&
        needs.assemble-and-release.result == 'success'
      }}
    needs: assemble-and-release
    runs-on: ubuntu-24.04
    environment: npm-production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # Node 24 bundles npm >= 11.5.1, required for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@reb.ai'
          package-manager-cache: false

      - name: Download npm tarballs from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.assemble-and-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/npm
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'codex-npm-*.tgz' \
            --dir dist/npm

          shopt -s nullglob
          archives=(dist/npm/codex-npm-*.tgz)
          ((${#archives[@]} == 9)) || {
            echo "Expected nine npm tarballs; found ${#archives[@]}" >&2
            exit 1
          }

          for archive in "${archives[@]}"; do
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "$(basename "${archive}").sha256" \
              --dir dist/npm
          done

      - name: Audit npm packages
        env:
          RELEASE_VERSION: ${{ needs.assemble-and-release.outputs.package_version }}
        run: |
          set -euo pipefail
          python3 scripts/audit_npm_packages.py \
            --artifact-dir dist/npm \
            --expected-version "${RELEASE_VERSION}"

      # No NODE_AUTH_TOKEN is needed: npm obtains a short-lived OIDC credential.
      # Publish serially because all platform packages share the same npm name.
      - name: Publish to npm
        env:
          RELEASE_VERSION: ${{ needs.assemble-and-release.outputs.package_version }}
        run: |
          set -euo pipefail
          platforms=(
            linux-x64
            linux-arm64
            darwin-x64
            darwin-arm64
            win32-x64
            win32-arm64
            linux-armv7
            android-arm64
          )
          root_tarball="dist/npm/codex-npm-${RELEASE_VERSION}.tgz"

          for platform in "${platforms[@]}"; do
            tarball="dist/npm/codex-npm-${platform}-${RELEASE_VERSION}.tgz"
            [[ -f "${tarball}" ]] || { echo "Missing npm tarball: ${tarball}" >&2; exit 1; }
            tag="${platform}"
            [[ "${RELEASE_VERSION}" == *-* ]] && tag="alpha-${platform}"
            echo "+ npm publish ${tarball} --access public --tag ${tag}"
            npm publish "${tarball}" --access public --tag "${tag}"
          done

          [[ -f "${root_tarball}" ]] || { echo "Missing npm tarball: ${root_tarball}" >&2; exit 1; }
          root_tag=latest
          [[ "${RELEASE_VERSION}" == *-* ]] && root_tag=alpha
          echo "+ npm publish ${root_tarball} --access public --tag ${root_tag}"
          npm publish "${root_tarball}" --access public --tag "${root_tag}"
