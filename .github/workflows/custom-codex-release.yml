# Builds, uploads, and publishes the fork-owned npm artifacts.
name: custom-codex-release

on:
  push:
    tags:
      - "codex-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "codex-v* tag to build"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: custom-codex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    outputs:
      package_version: ${{ steps.candidate.outputs.version }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      source_tag: ${{ steps.candidate.outputs.source_tag }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "${tag}" == codex-v* ]] || { echo "Invalid release tag: ${tag}" >&2; exit 1; }
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Determine candidate package version
        id: candidate
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/Cargo.toml | head -n 1)"
          tag="${{ steps.release.outputs.tag }}"
          package_version="${tag#codex-v}"
          [[ "${package_version}" == "${base_version}."* ]] || {
            echo "Release tag does not contain the workspace version: ${tag}" >&2
            exit 1
          }
          candidate_suffix="${package_version#${base_version}.}"
          [[ "${candidate_suffix}" =~ ^[0-9a-f]{10}\.[0-9]{12}$ ]] || {
            echo "Release tag does not contain a valid candidate suffix: ${tag}" >&2
            exit 1
          }
          commit="$(git rev-parse --short=10 HEAD)"
          [[ "${candidate_suffix%%.*}" == "${commit}" ]] || {
            echo "Release tag commit does not match checked-out commit: ${tag}" >&2
            exit 1
          }
          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "source_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=codex-npm-v${package_version}" >> "${GITHUB_OUTPUT}"


  build-source-target:
    name: Build npm source target - ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build_mode: direct
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            build_mode: direct
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            build_mode: direct
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-15
            build_mode: direct
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            build_mode: direct
          - platform: win32-arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            build_mode: direct
          - platform: linux-armv7
            target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04
            build_mode: rebuild
            rebuild_target: armv7
          - platform: android-arm64
            target: aarch64-linux-android
            runner: ubuntu-24.04
            build_mode: rebuild
            rebuild_target: android
    env:
      CARGO_NET_OFFLINE: "false"
      RUST_BACKTRACE: "1"
      RUST_TOOLCHAIN: "1.95.0"
      ANDROID_NDK_VERSION: "28.2.13676358"
      RUSTY_V8_COMMIT: "58fb8ceb62e9231002719ee2a4f227d17c938a90"
      RUSTY_V8_RELEASE_REPO: "rebroad/rusty_v8"
      RUSTY_V8_MUSL_ARCHIVE_SHA256: "9d9d1c14aa14f64231b051679b3350038f608f06be1d07a4c2c812f601a78e65"
      RUSTY_V8_MUSL_BINDING_SHA256: "639421ae6a0d125dde076cdb4c5d5b3afc9e3ce764acad4a772b7182ea77da66"
      RUSTY_V8_ARMV7_ARCHIVE_SHA256: "2a842cfcd792317a3e521f67f98167751b8f1043a01c59ec483e8c49d3d081ed"
      RUSTY_V8_ARMV7_BINDING_SHA256: "600de6702ca024c670310f14464cc892b1a1b4ae596f9898127d9e98263185a3"
      RUSTY_V8_ANDROID_ARCHIVE_SHA256: "58753130e13184681966ec64fdef84ee0fb85d51a6bde8e01d54700f97a353ec"
      RUSTY_V8_ANDROID_BINDING_SHA256: "c87a57bbad22339684cda2759ccb1e0fe15d0edc9dc9d70a2e1d0a40f674dee7"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare-release.outputs.source_tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf jq

      - name: Install Zig for musl source builds
        if: matrix.build_mode == 'direct' && contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          zig_version=0.14.0
          case "$(uname -m)" in
            x86_64) zig_arch=x86_64 ;;
            aarch64|arm64) zig_arch=aarch64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          zig_root="${RUNNER_TEMP}/zig-${zig_version}-${zig_arch}"
          if [[ ! -x "${zig_root}/zig" ]]; then
            archive="${RUNNER_TEMP}/zig-${zig_version}-${zig_arch}.tar.xz"
            curl --fail --location --retry 3 --silent --show-error \
              "https://ziglang.org/download/${zig_version}/zig-linux-${zig_arch}-${zig_version}.tar.xz" \
              --output "${archive}"
            rm -rf "${zig_root}"
            mkdir -p "${zig_root}"
            tar -xJf "${archive}" --strip-components=1 -C "${zig_root}"
          fi
          echo "${zig_root}" >> "${GITHUB_PATH}"
          "${zig_root}/zig" version

      - name: Build unsupported Rusty V8 targets from source
        if: matrix.build_mode == 'direct' && matrix.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: echo 'V8_FROM_SOURCE=1' >> "${GITHUB_ENV}"

      - name: Configure musl build tools
        if: matrix.build_mode == 'direct' && contains(matrix.target, 'unknown-linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/install-musl-build-tools.sh

      - name: Install Android NDK
        if: matrix.rebuild_target == 'android'
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set on the GitHub runner}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Checkout patched Rusty V8 source
        if: matrix.build_mode == 'rebuild'
        run: |
          set -euo pipefail
          rusty_v8="${GITHUB_WORKSPACE%/codex}/rusty_v8"
          git init "${rusty_v8}"
          git -C "${rusty_v8}" remote add origin https://github.com/rebroad/rusty_v8.git
          git -C "${rusty_v8}" fetch --depth 1 origin "${RUSTY_V8_COMMIT}"
          git -C "${rusty_v8}" checkout --detach "${RUSTY_V8_COMMIT}"
          git -C "${rusty_v8}" submodule update --init --depth 1 --recursive
          mkdir -p "${rusty_v8}.build"

      - name: Configure Windows linker
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Configure Rusty V8 artifacts
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
          release-repo: rebroad/rusty_v8
          archive-sha256: ${{ env.RUSTY_V8_MUSL_ARCHIVE_SHA256 }}
          binding-sha256: ${{ env.RUSTY_V8_MUSL_BINDING_SHA256 }}

      - name: Build fork target from source
        if: matrix.build_mode == 'rebuild'
        env:
          CODEX_BUILD_FROM_SOURCE: "true"
          VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}.build"
          ./scripts/rebuild_codex.sh \
            --release \
            --target "${{ matrix.rebuild_target }}" \
            --package-npm \
            --package-version "${VERSION}"
          mkdir -p "${GITHUB_WORKSPACE}.build/npm-source-artifact"
          cp "${GITHUB_WORKSPACE}.build/build/npm-artifact/codex-npm-${{ matrix.platform }}-${VERSION}.tgz" \
            "${GITHUB_WORKSPACE}.build/npm-source-artifact/"

      - name: Build and package source target
        if: matrix.build_mode == 'direct'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare-release.outputs.package_version }}
          OUTPUT_DIR: ${{ github.workspace }}.build/npm-source-artifact
          CARGO_TARGET_DIR: ${{ github.workspace }}.build/cargo-target
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/codex-rs"
          build_args=(
            cargo build --target "${TARGET}" --release --timings
            --bin codex
            --bin codex-code-mode-host
          )
          case "${TARGET}" in
            *-unknown-linux-musl) build_args+=(--bin bwrap) ;;
            x86_64-pc-windows-msvc) export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC ;;
          esac
          "${build_args[@]}"

          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          vendor_dir="${RUNNER_TEMP}/codex-npm-vendor-${TARGET}"
          rm -rf "${vendor_dir}"
          mkdir -p "${vendor_dir}/${TARGET}/bin"
          binary_suffix=""
          [[ "${TARGET}" == *-pc-windows-msvc ]] && binary_suffix=.exe
          cp "${release_dir}/codex${binary_suffix}" \
            "${vendor_dir}/${TARGET}/bin/codex${binary_suffix}"
          cp "${release_dir}/codex-code-mode-host${binary_suffix}" \
            "${vendor_dir}/${TARGET}/bin/codex-code-mode-host${binary_suffix}"
          if [[ "${TARGET}" == *-unknown-linux-musl ]]; then
            mkdir -p "${vendor_dir}/${TARGET}/codex-resources"
            cp "${release_dir}/bwrap" "${vendor_dir}/${TARGET}/codex-resources/bwrap"
          fi

          mkdir -p "${OUTPUT_DIR}"
          python3 "${GITHUB_WORKSPACE}/codex-cli/scripts/build_npm_package.py" \
            --release-version "${VERSION}" \
            --package "codex-${{ matrix.platform }}" \
            --vendor-src "${vendor_dir}" \
            --pack-output "${OUTPUT_DIR}/codex-npm-${{ matrix.platform }}-${VERSION}.tgz"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-source-${{ matrix.platform }}
          path: ${{ github.workspace }}.build/npm-source-artifact/*.tgz
          if-no-files-found: error

  assemble-and-release:
    needs:
      - prepare-release
      - build-source-target
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ needs.prepare-release.outputs.package_version }}
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare-release.outputs.source_tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-source-*
          merge-multiple: true
          path: dist/npm-source

      - name: Assemble and audit source-built packages
        env:
          VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: |
          set -euo pipefail
          python3 scripts/assemble_npm_packages.py \
            --release-version "${VERSION}" \
            --no-upstream \
            --fork-artifact-dir dist/npm-source \
            --output-dir dist/npm-complete
          for archive in dist/npm-complete/codex-npm-*.tgz; do
            sha256sum "${archive}" >"${archive}.sha256"
          done
          python3 scripts/audit_npm_packages.py \
            --artifact-dir dist/npm-complete \
            --expected-version "${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "codex-npm-v${VERSION}" \
            --title "Codex ${VERSION}" \
            --generate-notes \
            dist/npm-complete/codex-npm-*.tgz \
            dist/npm-complete/codex-npm-*.tgz.sha256 \
            dist/npm-complete/npm-artifact-sources.json

  publish-npm:
    name: publish-npm
    if: >-
      ${{
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/codex-v') &&
        needs.assemble-and-release.result == 'success'
      }}
    needs: assemble-and-release
    runs-on: ubuntu-24.04
    environment: npm-production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # Node 24 bundles npm >= 11.5.1, required for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@reb.ai'
          package-manager-cache: false

      - name: Download npm tarballs from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.assemble-and-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/npm
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'codex-npm-*.tgz' \
            --dir dist/npm

          shopt -s nullglob
          archives=(dist/npm/codex-npm-*.tgz)
          ((${#archives[@]} == 9)) || {
            echo "Expected nine npm tarballs; found ${#archives[@]}" >&2
            exit 1
          }

          for archive in "${archives[@]}"; do
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "$(basename "${archive}").sha256" \
              --dir dist/npm
          done

      - name: Audit npm packages
        env:
          RELEASE_VERSION: ${{ needs.assemble-and-release.outputs.package_version }}
        run: |
          set -euo pipefail
          python3 scripts/audit_npm_packages.py \
            --artifact-dir dist/npm \
            --expected-version "${RELEASE_VERSION}"

      # No NODE_AUTH_TOKEN is needed: npm obtains a short-lived OIDC credential.
      # Publish serially because all platform packages share the same npm name.
      - name: Publish to npm
        env:
          RELEASE_VERSION: ${{ needs.assemble-and-release.outputs.package_version }}
        run: |
          set -euo pipefail
          platforms=(
            linux-x64
            linux-arm64
            darwin-x64
            darwin-arm64
            win32-x64
            win32-arm64
            linux-armv7
            android-arm64
          )
          root_tarball="dist/npm/codex-npm-${RELEASE_VERSION}.tgz"

          for platform in "${platforms[@]}"; do
            tarball="dist/npm/codex-npm-${platform}-${RELEASE_VERSION}.tgz"
            [[ -f "${tarball}" ]] || { echo "Missing npm tarball: ${tarball}" >&2; exit 1; }
            tag="${platform}"
            [[ "${RELEASE_VERSION}" == *-* ]] && tag="alpha-${platform}"
            echo "+ npm publish ${tarball} --access public --tag ${tag}"
            npm publish "${tarball}" --access public --tag "${tag}"
          done

          [[ -f "${root_tarball}" ]] || { echo "Missing npm tarball: ${root_tarball}" >&2; exit 1; }
          root_tag=latest
          [[ "${RELEASE_VERSION}" == *-* ]] && root_tag=alpha
          echo "+ npm publish ${root_tarball} --access public --tag ${root_tag}"
          npm publish "${root_tarball}" --access public --tag "${root_tag}"
