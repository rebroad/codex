# Builds, uploads, and publishes the fork-owned npm artifacts.
name: custom-codex-release

on:
  push:
    tags:
      - "codex-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "codex-v* tag to build"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: custom-codex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    outputs:
      package_version: ${{ steps.candidate.outputs.version }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_OFFLINE: "false"
      RUST_BACKTRACE: "1"
      RUST_TOOLCHAIN: "1.95.0"
      ANDROID_NDK_VERSION: "28.2.13676358"
      RUSTY_V8_COMMIT: "58fb8ceb62e9231002719ee2a4f227d17c938a90"
      RUSTY_V8_RELEASE_REPO: "rebroad/rusty_v8"
      RUSTY_V8_MUSL_ARCHIVE_SHA256: "9d9d1c14aa14f64231b051679b3350038f608f06be1d07a4c2c812f601a78e65"
      RUSTY_V8_MUSL_BINDING_SHA256: "639421ae6a0d125dde076cdb4c5d5b3afc9e3ce764acad4a772b7182ea77da66"
      RUSTY_V8_ARMV7_ARCHIVE_SHA256: "2a842cfcd792317a3e521f67f98167751b8f1043a01c59ec483e8c49d3d081ed"
      RUSTY_V8_ARMV7_BINDING_SHA256: "600de6702ca024c670310f14464cc892b1a1b4ae596f9898127d9e98263185a3"
      RUSTY_V8_ANDROID_ARCHIVE_SHA256: "58753130e13184681966ec64fdef84ee0fb85d51a6bde8e01d54700f97a353ec"
      RUSTY_V8_ANDROID_BINDING_SHA256: "c87a57bbad22339684cda2759ccb1e0fe15d0edc9dc9d70a2e1d0a40f674dee7"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "${tag}" == codex-v* ]] || { echo "Invalid release tag: ${tag}" >&2; exit 1; }
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Determine candidate package version
        id: candidate
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/Cargo.toml | head -n 1)"
          commit="$(git rev-parse --short=12 HEAD)"
          timestamp="$(date -u +%Y%m%d%H%M)"
          package_version="${base_version}.${commit}.${timestamp}"
          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=codex-npm-v${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve latest upstream native artifacts
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow="$(gh run list \
            --repo openai/codex \
            --workflow rust-release.yml \
            --branch "rust-v${{ steps.candidate.outputs.base_version }}" \
            --limit 20 \
            --json url,status,conclusion,createdAt \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | first')"
          [[ "${workflow}" != null && -n "${workflow}" ]] || {
            echo "No successful upstream rust-release workflow found" >&2
            exit 1
          }
          echo "url=$(jq -r .url <<<"${workflow}")" >> "${GITHUB_OUTPUT}"
          echo "Using upstream workflow $(jq -r .url <<<"${workflow}")"

      - name: Install cross-compilation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf jq
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal

      - name: Install Android NDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set on the GitHub runner}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Checkout patched Rusty V8 source
        run: |
          set -euo pipefail
          rusty_v8="${GITHUB_WORKSPACE%/codex}/rusty_v8"
          git init "${rusty_v8}"
          git -C "${rusty_v8}" remote add origin https://github.com/rebroad/rusty_v8.git
          git -C "${rusty_v8}" fetch --depth 1 origin "${RUSTY_V8_COMMIT}"
          git -C "${rusty_v8}" checkout --detach "${RUSTY_V8_COMMIT}"
          git -C "${rusty_v8}" submodule update --init --depth 1 --recursive
          mkdir -p "${rusty_v8}.build"

      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}.build"
          ./scripts/rebuild_codex.sh --release --target all --package-npm \
            --package-version "${{ steps.candidate.outputs.version }}"
          python3 scripts/assemble_npm_packages.py \
            --release-version "${{ steps.candidate.outputs.version }}" \
            --upstream-version "${{ steps.candidate.outputs.base_version }}" \
            --upstream-repo openai/codex \
            --upstream-workflow-url "${{ steps.upstream.outputs.url }}" \
            --upstream-artifacts-dir "${GITHUB_WORKSPACE}.build/build/upstream-artifacts" \
            --fork-artifact-dir "${GITHUB_WORKSPACE}.build/build/npm-artifact" \
            --output-dir "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete"

      - name: Verify complete package set
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/"*.tgz )
          ((${#archives[@]} == 9)) || { echo "Expected nine complete npm archives; found ${#archives[@]}" >&2; exit 1; }
          scripts/audit_npm_packages.py \
            --artifact-dir "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete" \
            --expected-version "${{ steps.candidate.outputs.version }}"

      - name: Create package checksums
        run: |
          set -euo pipefail
          for archive in "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/"*.tgz; do
            sha256sum "${archive}" >"${archive}.sha256"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.candidate.outputs.release_tag }}" \
            --title "Codex ${{ steps.candidate.outputs.version }}" \
            --generate-notes \
            "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/"*.tgz \
            "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/"*.tgz.sha256 \
            "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/npm-artifact-sources.json"

  publish-npm:
    name: publish-npm
    if: >-
      ${{
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/codex-v') &&
        needs.build-and-release.result == 'success'
      }}
    needs: build-and-release
    runs-on: ubuntu-24.04
    environment: npm-production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # Node 24 bundles npm >= 11.5.1, required for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@reb.ai'
          package-manager-cache: false

      - name: Download npm tarballs from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/npm
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'codex-npm-*.tgz' \
            --dir dist/npm

          shopt -s nullglob
          archives=(dist/npm/codex-npm-*.tgz)
          ((${#archives[@]} == 9)) || {
            echo "Expected nine npm tarballs; found ${#archives[@]}" >&2
            exit 1
          }

          for archive in "${archives[@]}"; do
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "$(basename "${archive}").sha256" \
              --dir dist/npm
          done

      - name: Audit npm packages
        env:
          RELEASE_VERSION: ${{ needs.build-and-release.outputs.package_version }}
        run: |
          set -euo pipefail
          python3 scripts/audit_npm_packages.py \
            --artifact-dir dist/npm \
            --expected-version "${RELEASE_VERSION}"

      # No NODE_AUTH_TOKEN is needed: npm obtains a short-lived OIDC credential.
      # Publish serially because all platform packages share the same npm name.
      - name: Publish to npm
        env:
          RELEASE_VERSION: ${{ needs.build-and-release.outputs.package_version }}
        run: |
          set -euo pipefail
          platforms=(
            linux-x64
            linux-arm64
            darwin-x64
            darwin-arm64
            win32-x64
            win32-arm64
            linux-armv7
            android-arm64
          )
          root_tarball="dist/npm/codex-npm-${RELEASE_VERSION}.tgz"

          for platform in "${platforms[@]}"; do
            tarball="dist/npm/codex-npm-${platform}-${RELEASE_VERSION}.tgz"
            [[ -f "${tarball}" ]] || { echo "Missing npm tarball: ${tarball}" >&2; exit 1; }
            tag="${platform}"
            [[ "${RELEASE_VERSION}" == *-* ]] && tag="alpha-${platform}"
            echo "+ npm publish ${tarball} --access public --tag ${tag}"
            npm publish "${tarball}" --access public --tag "${tag}"
          done

          [[ -f "${root_tarball}" ]] || { echo "Missing npm tarball: ${root_tarball}" >&2; exit 1; }
          root_tag=latest
          [[ "${RELEASE_VERSION}" == *-* ]] && root_tag=alpha
          echo "+ npm publish ${root_tarball} --access public --tag ${root_tag}"
          npm publish "${root_tarball}" --access public --tag "${root_tag}"
