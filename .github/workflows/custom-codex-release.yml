# Builds and uploads the fork-owned npm artifacts. Publishing is deliberately
# performed locally after the complete artifact set has been downloaded and
# audited with scripts/publish_npm_local.sh.
name: custom-codex-release

on:
  push:
    tags:
      - "codex-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "codex-v* tag to build"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: custom-codex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_OFFLINE: "false"
      RUST_BACKTRACE: "1"
      RUST_TOOLCHAIN: "1.95.0"
      ANDROID_NDK_VERSION: "28.2.13676358"
      RUSTY_V8_COMMIT: "58fb8ceb62e9231002719ee2a4f227d17c938a90"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "${tag}" == codex-v* ]] || { echo "Invalid release tag: ${tag}" >&2; exit 1; }
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Determine candidate package version
        id: candidate
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/Cargo.toml | head -n 1)"
          commit="$(git rev-parse --short=12 HEAD)"
          timestamp="$(date -u +%Y%m%d%H%M)"
          package_version="${base_version}.${commit}.${timestamp}"
          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=codex-npm-v${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve latest upstream native artifacts
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow="$(gh run list \
            --repo openai/codex \
            --workflow rust-release.yml \
            --branch "rust-v${{ steps.candidate.outputs.base_version }}" \
            --limit 20 \
            --json url,status,conclusion,createdAt \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | first')"
          [[ "${workflow}" != null && -n "${workflow}" ]] || {
            echo "No successful upstream rust-release workflow found" >&2
            exit 1
          }
          echo "url=$(jq -r .url <<<"${workflow}")" >> "${GITHUB_OUTPUT}"
          echo "Using upstream workflow $(jq -r .url <<<"${workflow}")"

      - name: Install cross-compilation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools gcc-arm-linux-gnueabihf jq
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal

      - name: Install Android NDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set on the GitHub runner}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Checkout patched Rusty V8 source
        run: |
          set -euo pipefail
          rusty_v8="${GITHUB_WORKSPACE%/codex}/rusty_v8"
          git init "${rusty_v8}"
          git -C "${rusty_v8}" remote add origin https://github.com/rebroad/rusty_v8.git
          git -C "${rusty_v8}" fetch --depth 1 origin "${RUSTY_V8_COMMIT}"
          git -C "${rusty_v8}" checkout --detach "${RUSTY_V8_COMMIT}"
          git -C "${rusty_v8}" submodule update --init --depth 1 --recursive

      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}.build"
          ./scripts/rebuild_codex.sh --release --target all --package-npm \
            --package-version "${{ steps.candidate.outputs.version }}"
          python3 scripts/assemble_npm_packages.py \
            --release-version "${{ steps.candidate.outputs.version }}" \
            --upstream-version "${{ steps.candidate.outputs.base_version }}" \
            --upstream-repo openai/codex \
            --upstream-workflow-url "${{ steps.upstream.outputs.url }}" \
            --upstream-artifacts-dir "${GITHUB_WORKSPACE}.build/build/upstream-artifacts" \
            --fork-artifact-dir "${GITHUB_WORKSPACE}.build/build/npm-artifact" \
            --output-dir "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete"

      - name: Verify complete package set
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/"*.tgz )
          ((${#archives[@]} == 9)) || { echo "Expected nine complete npm archives; found ${#archives[@]}" >&2; exit 1; }
          scripts/audit_npm_packages.py \
            --artifact-dir "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete" \
            --expected-version "${{ steps.candidate.outputs.version }}"

      - name: Create package checksums
        run: |
          set -euo pipefail
          for archive in "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/"*.tgz; do
            sha256sum "${archive}" >"${archive}.sha256"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.candidate.outputs.release_tag }}" \
            --title "Codex ${{ steps.candidate.outputs.version }}" \
            --generate-notes \
            "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/"*.tgz \
            "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/"*.tgz.sha256 \
            "${GITHUB_WORKSPACE}.build/build/npm-artifact-complete/npm-artifact-sources.json"
