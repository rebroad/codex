name: setup-rusty-v8
description: Download and verify the target-selected Rusty V8 artifacts for Cargo builds.
inputs:
  target:
    description: Rust target triple with Codex-built V8 release artifacts.
    required: true
  release-repo:
    description: GitHub repository containing the Rusty V8 release artifacts; auto selects the fork override targets.
    required: false
    default: auto
  archive-sha256:
    description: Expected SHA-256 for the downloaded archive, if no manifest asset is published.
    required: false
  binding-sha256:
    description: Expected SHA-256 for the downloaded source binding, if no manifest asset is published.
    required: false

runs:
  using: composite
  steps:
    - name: Configure rusty_v8 artifact overrides and verify checksums
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE_REPO: ${{ inputs.release-repo }}
        ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
        BINDING_SHA256: ${{ inputs.binding-sha256 }}
      run: |
        set -euo pipefail

        version="$(python3 "${GITHUB_WORKSPACE}/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
        release_tag="rusty-v8-v${version}"
        if [[ "${RELEASE_REPO}" == auto ]]; then
          case "${TARGET}" in
            x86_64-unknown-linux-musl|armv7-unknown-linux-gnueabihf|aarch64-linux-android)
              release_repo="rebroad/rusty_v8"
              ;;
            *)
              release_repo="openai/codex"
              ;;
          esac
        else
          release_repo="${RELEASE_REPO}"
        fi
        echo "Using Rusty V8 release repository ${release_repo} for ${TARGET}."
        base_url="https://github.com/${release_repo}/releases/download/${release_tag}"
        binding_dir="${RUNNER_TEMP}/rusty_v8"
        
        profile="${RUSTY_V8_PROFILE:-}"
        if [[ -z "${profile}" ]]; then
          case "${TARGET}" in
            armv7-unknown-linux-gnueabihf) profile=release ;;
            *) profile=ptrcomp_sandbox_release ;;
          esac
        fi

        if [[ "$TARGET" == *-pc-windows-msvc ]]; then
          archive_name="rusty_v8_${profile}_${TARGET}.lib.gz"
        else
          archive_name="librusty_v8_${profile}_${TARGET}.a.gz"
        fi
        binding_name="src_binding_${profile}_${TARGET}.rs"
        checksums_name="rusty_v8_${profile}_${TARGET}.sha256"

        archive_path="${binding_dir}/${archive_name}"
        binding_path="${binding_dir}/${binding_name}"
        checksums_path="${binding_dir}/${checksums_name}"

        mkdir -p "${binding_dir}"
        curl -fsSL "${base_url}/${archive_name}" -o "${archive_path}"
        curl -fsSL "${base_url}/${binding_name}" -o "${binding_path}"
        if [[ -n "${ARCHIVE_SHA256}" || -n "${BINDING_SHA256}" ]]; then
          [[ -n "${ARCHIVE_SHA256}" && -n "${BINDING_SHA256}" ]] || {
            echo "Both archive-sha256 and binding-sha256 are required together." >&2
            exit 1
          }
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${ARCHIVE_SHA256}" "${archive_path}" | sha256sum -c -
            printf '%s  %s\n' "${BINDING_SHA256}" "${binding_path}" | sha256sum -c -
          else
            printf '%s  %s\n' "${ARCHIVE_SHA256}" "${archive_path}" | shasum -a 256 -c -
            printf '%s  %s\n' "${BINDING_SHA256}" "${binding_path}" | shasum -a 256 -c -
          fi
        else
          curl -fsSL "${base_url}/${checksums_name}" -o "${checksums_path}"

          if [[ "$(wc -l < "${checksums_path}")" -ne 2 ]]; then
            echo "Expected exactly two checksums for ${TARGET} in ${checksums_path}" >&2
            exit 1
          fi

          # Existing Windows-built release manifests use CRLF line endings.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | sha256sum -c -)
          else
            (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | shasum -a 256 -c -)
          fi
        fi
        echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
        echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"
