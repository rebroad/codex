[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode-runtime"
version.workspace = true

[lib]
doctest = false
name = "codex_code_mode_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-code-mode-protocol = { workspace = true }
codex-protocol = { workspace = true }
deno_core_icudata = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "arm"))'.dependencies]
v8 = { workspace = true, features = ["v8_enable_sandbox"] }

[target.'cfg(target_arch = "arm")'.dependencies]
# V8's sandbox requires external code space, which V8 currently supports only
# on 64-bit targets. ARMv7 therefore uses the same Code Mode runtime without
# the sandbox until V8 gains a supported 32-bit configuration.
v8 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
