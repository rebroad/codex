[package]
name = "codex-app-server-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_app_server_transport"
path = "src/lib.rs"
doctest = false

[features]
default = ["remote-control", "websocket"]
remote-control = [
    "dep:codex-api",
    "dep:codex-http-client",
    "dep:codex-login",
    "dep:codex-model-provider",
    "dep:codex-state",
    "dep:codex-websocket-client",
    "dep:codex-utils-rustls-provider",
    "dep:base64",
    "dep:gethostname",
    "dep:httpdate",
    "dep:rand",
    "dep:time",
    "dep:uuid",
]
websocket = ["dep:axum", "dep:codex-websocket-auth", "dep:owo-colors"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true, optional = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
base64 = { workspace = true, optional = true }
codex-api = { workspace = true, optional = true }
codex-app-server-protocol = { workspace = true }
codex-http-client = { workspace = true, optional = true }
codex-login = { workspace = true, optional = true }
codex-model-provider = { workspace = true, optional = true }
codex-protocol = { workspace = true }
codex-state = { workspace = true, optional = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-file-lock = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-path = { workspace = true }
codex-utils-rustls-provider = { workspace = true, optional = true }
codex-websocket-auth = { workspace = true, optional = true }
codex-websocket-client = { workspace = true, optional = true }
futures = { workspace = true }
gethostname = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true, features = ["supports-colors"] }
rand = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, optional = true, features = ["serde", "v7"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
codex-config = { workspace = true }
codex-core = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
